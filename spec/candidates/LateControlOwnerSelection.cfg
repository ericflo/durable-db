SPECIFICATION TraceSpec
CONSTANTS
  Epochs = 1
  Lease = 2
  MaxTime = 5
  MaxRevision = 8
  MaxRenewals = 2
  MaxChildRequests = 0
  Partitions = {a}
  Generations = 2
  MaxOwnerRequests = 1
  UnsafeLateRoot = FALSE
  UnsafeStaleRenewal = FALSE
  UnsafeSkipDrain = FALSE
  UnsafeLongChild = FALSE
  UnsafeLateChild = FALSE
  UnsafeAssignment = FALSE
  UnsafeMoveDrain = FALSE
  UnsafeOwnerReply = FALSE
  LogLength = 1
  UnsafeJournalPermission = FALSE
  UnsafeJournalGap = FALSE
  UnsafeJournalEarly = FALSE
  UnsafeJournalMissing = FALSE
  UnsafeJournalReseal = FALSE
  UnsafeJournalReady = FALSE
INVARIANTS HistoryStrong RootExclusive ChildWithinRoot ChildExclusive
           OwnerWithinRoot PartitionExclusive ServingHistory NotLateOwnerSelection
CONSTRAINT HistorySmall
CHECK_DEADLOCK FALSE
