[package]
name = "durable-db"
version = "2.1.6"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "A transactional ordered database whose source of truth is an object-storage bucket"
repository = "https://github.com/ericflo/durable-db"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful", "service"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
parking_lot = "0.12"
postcard = { version = "1", default-features = false, features = ["use-std"] }
quick_cache = "0.6"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10"
smallvec = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The allocator is part of the binary: see `ALLOCATOR` in src/main.rs.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
