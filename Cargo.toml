[package]
name = "durable-db"
version = "0.7.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Transactional ordered storage with disposable compute and authoritative object storage"
repository = "https://github.com/ericflo/durable-db"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
humantime = "2"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
quick-xml = { version = "0.41", features = ["serialize"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["process", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
