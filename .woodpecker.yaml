when:
  - event: [push, manual, tag]

steps:
  - name: dependency-audit
    image: docker.io/library/rust:1.90-bookworm@sha256:3f6e6f8d8725a65a2db964bb828850f888d430c68784d661f753144e5d787207
    commands:
      - scripts/audit-dependencies.sh
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
  - name: javascript-audit
    image: docker.io/library/node:24-bookworm-slim@sha256:c0a93797ee78814ae6d32fcca2561fdbbe423149c3f5389aad32d86e9fd85bd4
    commands:
      - npm --prefix clients/javascript audit
      - npm --prefix examples/web-app audit
      - npm --prefix site audit
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
  - name: verify-and-build
    depends_on: [dependency-audit, javascript-audit]
    image: docker.io/moby/buildkit:v0.34.2-rootless@sha256:c8252268760e1baba80780d63d738ef9f260fb7c7c0973c78494cb9ddd99eda1
    commands:
      - DURABLE_DB_BUILD_CONTEXT=$$(scripts/prepare-build-context.sh)
      - export DURABLE_DB_BUILD_CONTEXT
      - trap 'rm -rf "$${DURABLE_DB_BUILD_CONTEXT}"' EXIT
      - |
        run_buildctl() {
          buildctl "$$@" &
          build_pid=$$!
          trap 'kill -TERM "$${build_pid}" 2>/dev/null || :; wait "$${build_pid}" || :; exit 143' TERM INT
          build_status=0
          wait "$${build_pid}" || build_status=$$?
          trap - TERM INT
          return "$${build_status}"
        }
      - >-
        run_buildctl --addr tcp://buildkit.ci-build.svc.cluster.local:1234 build
        --frontend dockerfile.v0 --local context=$${DURABLE_DB_BUILD_CONTEXT}/tree --local dockerfile=$${DURABLE_DB_BUILD_CONTEXT}/tree
        --opt target=artifacts --opt platform=linux/amd64
        --import-cache type=registry,ref=registry.clouderic.svc.cluster.local:5000/durable-db-build-cache:main,registry.insecure=true
        --export-cache type=registry,ref=registry.clouderic.svc.cluster.local:5000/durable-db-build-cache:main,mode=max,registry.insecure=true
        --output type=local,dest=.artifacts
      - >-
        run_buildctl --addr tcp://buildkit.ci-build.svc.cluster.local:1234 build
        --frontend dockerfile.v0 --local context=$${DURABLE_DB_BUILD_CONTEXT}/tree --local dockerfile=$${DURABLE_DB_BUILD_CONTEXT}/tree
        --opt target=runtime --opt platform=linux/amd64
        --import-cache type=registry,ref=registry.clouderic.svc.cluster.local:5000/durable-db-build-cache:main,registry.insecure=true
        --output type=image,name=registry.clouderic.svc.cluster.local:5000/durable-db:$${CI_COMMIT_SHA},push=true,registry.insecure=true
      - >-
        run_buildctl --addr tcp://buildkit.ci-build.svc.cluster.local:1234 build
        --frontend dockerfile.v0 --local context=$${DURABLE_DB_BUILD_CONTEXT}/tree --local dockerfile=$${DURABLE_DB_BUILD_CONTEXT}/tree
        --opt target=artifacts --opt platform=linux/amd64
        --import-cache type=registry,ref=registry.clouderic.svc.cluster.local:5000/durable-db-build-cache:main,registry.insecure=true
        --output type=image,name=registry.clouderic.svc.cluster.local:5000/durable-db-artifacts:$${CI_COMMIT_SHA},push=true,registry.insecure=true
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
  - name: publish-docs
    image: docker.io/library/rust:1.90-bookworm@sha256:3f6e6f8d8725a65a2db964bb828850f888d430c68784d661f753144e5d787207
    depends_on: [verify-and-build]
    when:
      - evaluate: 'CI_COMMIT_BRANCH == CI_REPO_DEFAULT_BRANCH && CI_PIPELINE_EVENT != "tag"'
    environment:
      DOCS_DEPLOY_KEY:
        from_secret: docs_deploy_key
    commands:
      - scripts/publish-docs.sh .artifacts/site
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 256Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
