# Woodpecker builds everything through the Dockerfile: the model check, the
# Rust and client tests, the static binary, the website and the runtime image.
when:
  - event: [push, manual, tag]

steps:
  - name: dependency-audit
    image: localhost:32000/epsilon-ci-buildpack:main-20261128010825-1bc545742cc7@sha256:9f94d9d6ed8a9630ee38a019fc6a9785aa53ad2afe27c6b3474074da2a2a1fe7
    commands:
      - scripts/audit-dependencies.sh
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}

  - name: javascript-audit
    image: localhost:32000/epsilon-ci-buildpack:main-20261128010825-1bc545742cc7@sha256:9f94d9d6ed8a9630ee38a019fc6a9785aa53ad2afe27c6b3474074da2a2a1fe7
    commands:
      - scripts/audit-javascript.sh
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}

  - name: verify-and-build
    depends_on: [dependency-audit, javascript-audit]
    image: localhost:32000/epsilon-buildkit:main-20261128010825-1bc545742cc7@sha256:36b2e87404bfc2253c02e54ece0e3ed3eb72aa89f0dfa701d065064a28915ac5
    commands:
      # A clean copy of the commit with stable permissions, so the build
      # cache does not depend on how the checkout volume was mounted. It is
      # in the step's own temporary directory and goes away with the step.
      - DURABLE_DB_BUILD_CONTEXT=$$(scripts/prepare-build-context.sh)
      - export DURABLE_DB_BUILD_CONTEXT
      - |
        registry=registry.clouderic.svc.cluster.local:5000
        cache="$${registry}/durable-db-build-cache:main"
        build() {
          target=$$1; shift
          buildctl --addr tcp://buildkit.ci-build.svc.cluster.local:1234 build \
            --frontend dockerfile.v0 \
            --local "context=$${DURABLE_DB_BUILD_CONTEXT}/tree" \
            --local "dockerfile=$${DURABLE_DB_BUILD_CONTEXT}/tree" \
            --opt "target=$${target}" --opt platform=linux/amd64 \
            --opt "label:org.opencontainers.image.source=$${CI_REPO_URL}" \
            --opt "label:org.opencontainers.image.revision=$${CI_COMMIT_SHA}" \
            --import-cache "type=registry,ref=$${cache},registry.insecure=true" "$$@" &
          build_pid=$$!
          trap 'kill -TERM "$${build_pid}" 2>/dev/null || :; wait "$${build_pid}" || :; exit 143' TERM INT
          build_status=0
          wait "$${build_pid}" || build_status=$$?
          trap - TERM INT
          return "$${build_status}"
        }
        # Verify everything; keep the binary, its checksum and the website.
        build artifacts \
          --export-cache "type=registry,ref=$${cache},mode=max,registry.insecure=true" \
          --output type=local,dest=.artifacts
        # The runtime image: under the commit, and on main also under an
        # immutable tag that sorts by build time, for image automation.
        names="$${registry}/durable-db:$${CI_COMMIT_SHA}"
        if [ "$${CI_COMMIT_BRANCH:-}" = "$${CI_REPO_DEFAULT_BRANCH}" ] && [ "$${CI_PIPELINE_EVENT}" != tag ]; then
          stamp="$$(date -u -d "@$${CI_PIPELINE_CREATED}" +%Y%m%d%H%M%S)"
          short="$$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-12)"
          names="$${names},$${registry}/durable-db:main-$${stamp}-$${short}"
        fi
        build runtime --opt attest:provenance=mode=max \
          --output "type=image,\"name=$${names}\",push=true,registry.insecure=true"
        build artifacts \
          --output "type=image,name=$${registry}/durable-db-artifacts:$${CI_COMMIT_SHA},push=true,registry.insecure=true"
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}

  - name: publish-docs
    image: localhost:32000/epsilon-ci-buildpack:main-20261128010825-1bc545742cc7@sha256:9f94d9d6ed8a9630ee38a019fc6a9785aa53ad2afe27c6b3474074da2a2a1fe7
    depends_on: [verify-and-build]
    when:
      - evaluate: 'CI_COMMIT_BRANCH == CI_REPO_DEFAULT_BRANCH && CI_PIPELINE_EVENT != "tag"'
    environment:
      DOCS_DEPLOY_KEY:
        from_secret: docs_deploy_key
    commands:
      - scripts/publish-docs.sh .artifacts/site
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 256Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
