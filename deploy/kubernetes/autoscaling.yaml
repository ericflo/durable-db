apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: durable-db
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: durable-db}
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: durable-db
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: durable-db}
