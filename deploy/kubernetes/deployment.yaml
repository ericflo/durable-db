apiVersion: apps/v1
kind: Deployment
metadata:
  name: durable-db
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: durable-db}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: durable-db}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: durable-db}
      containers:
        - name: database
          # Replace through kustomize edit set image durable-db:local=REGISTRY/IMAGE@sha256:...
          image: durable-db:local
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --listen=0.0.0.0:7654
            - --admin-key-file=/run/keys/admin.key
            - --memory-cache-mib=64
            - --disk-cache=/cache/pages
            - --disk-cache-mib=128
            - --concurrency=8
          envFrom:
            - secretRef: {name: durable-db-storage}
          ports:
            - {name: http, containerPort: 7654}
          resources:
            requests: {cpu: 250m, memory: 192Mi}
            limits: {cpu: "2", memory: 768Mi}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: keys, mountPath: /run/keys, readOnly: true}
            - {name: cache, mountPath: /cache}
      volumes:
        - name: keys
          secret:
            secretName: durable-db-signing
            defaultMode: 0440
        - name: cache
          emptyDir: {sizeLimit: 256Mi}
