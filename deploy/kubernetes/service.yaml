# What applications connect to.
apiVersion: v1
kind: Service
metadata:
  name: durable-db
  labels: {app: durable-db}
spec:
  selector: {app: durable-db}
  ports:
    - {name: http, port: 7654, targetPort: http}
---
# How servers find each other: a DNS name that resolves to every ready pod.
apiVersion: v1
kind: Service
metadata:
  name: durable-db-peers
  labels: {app: durable-db}
spec:
  clusterIP: None
  selector: {app: durable-db}
  ports:
    - {name: http, port: 7654, targetPort: http}
