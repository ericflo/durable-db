[package]
name = "durable-db-slatedb-contract"
version = "0.0.0"
default-run = "durable-db-slatedb-contract"
edition = "2024"
rust-version = "1.91.1"
publish = false
license = "Apache-2.0"
[workspace]
[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
object_store = { version = "=0.14.2", default-features = false }
serde_json = "1"
slatedb = { version = "=0.18.1", default-features = false, features = ["moka"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
durable-db = { path = "../.." }
